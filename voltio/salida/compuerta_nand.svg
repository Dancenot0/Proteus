  .frame      { stroke: #b6bcc6; stroke-width: 1; }
  .tb-title   { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: #1b1f26; }
  .tb-sub     { font: 10px ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
  svg         { background: #fbfbfd; }
